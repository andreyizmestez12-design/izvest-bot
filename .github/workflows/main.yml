name: Auto Post to Instagram

on:
  schedule:
    # Запуск каждый день в 12:00 UTC (15:00 по Москве)
    - cron: '0 12 * * *'
  workflow_dispatch: # Эта строчка позволяет запустить бота вручную кнопкой

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run script
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python post.py
